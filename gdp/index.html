<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f6">
  <meta name="description" content="GDP 藥商名單手機查詢，可依縣市篩選、點電話撥號、記錄電訪進度。">
  <title>GDP 藥商電訪查詢</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8f6;
      --surface: #ffffff;
      --surface-soft: #eef4f1;
      --ink: #17211d;
      --muted: #62706a;
      --line: #dbe3df;
      --green: #19735a;
      --green-dark: #10533f;
      --blue: #275f9f;
      --amber: #b7791f;
      --red: #b3403b;
      --shadow: 0 18px 45px rgba(28, 41, 36, .12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Noto Sans", sans-serif;
      line-height: 1.5;
      letter-spacing: 0;
    }

    a {
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(246, 248, 246, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .wrap {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
    }

    .bar-inner {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px 0;
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.1;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-pill {
      display: grid;
      place-items: center;
      min-width: 96px;
      min-height: 54px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(28, 41, 36, .08);
      text-align: center;
    }

    .progress-pill strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }

    .progress-pill span {
      color: var(--muted);
      font-size: 12px;
    }

    main {
      padding: 16px 0 48px;
    }

    .controls {
      display: grid;
      grid-template-columns: 180px 1fr auto auto;
      gap: 10px;
      align-items: end;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    select,
    input[type="search"],
    input[type="tel"],
    textarea {
      width: 100%;
      border: 1px solid #cbd7d1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    select,
    input[type="search"],
    input[type="tel"] {
      min-height: 46px;
      padding: 0 12px;
    }

    textarea {
      min-height: 78px;
      padding: 10px 12px;
      resize: vertical;
    }

    select:focus,
    input[type="search"]:focus,
    input[type="tel"]:focus,
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(25, 115, 90, .14);
    }

    .toggle-row {
      display: flex;
      gap: 8px;
      align-items: center;
      min-height: 46px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      white-space: nowrap;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }

    .action-button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      padding: 0 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .action-button:active {
      transform: translateY(1px);
    }

    .city-strip {
      display: flex;
      gap: 8px;
      padding: 14px 0 4px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .city-chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 9px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .city-chip.active {
      border-color: var(--green);
      background: #e6f2ed;
      color: var(--green-dark);
      font-weight: 800;
    }

    .tag-filter {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(28, 41, 36, .06);
    }

    .filter-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .mode-button,
    .filter-chip {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .mode-button.active.want,
    .filter-chip.want {
      border-color: var(--green);
      background: #e6f2ed;
      color: var(--green-dark);
    }

    .mode-button.active.avoid,
    .filter-chip.avoid {
      border-color: #e5b8b5;
      background: #fff0ef;
      color: var(--red);
    }

    .tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-help {
      color: var(--muted);
      font-size: 13px;
    }

    .summary-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 12px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .summary-line strong {
      color: var(--ink);
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .company {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(28, 41, 36, .06);
    }

    .company.done {
      background: #f2f6f4;
      opacity: .82;
    }

    .serial {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #e6f2ed;
      color: var(--green-dark);
      font-weight: 900;
    }

    .company-main {
      min-width: 0;
    }

    .company-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .company h2 {
      margin: 0;
      font-size: clamp(18px, 3.8vw, 24px);
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 3px 9px;
      background: var(--surface-soft);
      color: #315146;
      font-size: 13px;
      font-weight: 700;
    }

    .tag.source {
      background: #edf3fb;
      color: var(--blue);
    }

    .tag.warn {
      background: #fff5df;
      color: var(--amber);
    }

    .intro,
    .address,
    .ops {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .intro {
      color: #33433d;
    }

    .merge-records {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #d8e7e0;
      border-radius: 8px;
      background: #f6fbf8;
    }

    .merge-records strong {
      display: block;
      margin-bottom: 8px;
      color: var(--green-dark);
    }

    .merge-row {
      display: grid;
      grid-template-columns: 80px 78px 1fr 1fr;
      gap: 8px;
      padding: 7px 0;
      border-top: 1px solid #dfeae5;
      color: #33433d;
      font-size: 14px;
    }

    .merge-row:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .merge-id,
    .merge-kind {
      font-weight: 900;
      color: var(--ink);
    }

    .card-actions {
      display: grid;
      grid-template-columns: minmax(0, 170px) auto auto;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }

    .phone-link,
    .small-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 8px;
      padding: 0 12px;
      text-decoration: none;
      font-weight: 900;
      white-space: nowrap;
    }

    .phone-link {
      background: var(--green);
      color: #fff;
    }

    .phone-link.missing {
      background: #e7ece9;
      color: #79857f;
      pointer-events: none;
    }

    .small-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .small-button.done {
      border-color: #b7d6cb;
      background: #e6f2ed;
      color: var(--green-dark);
    }

    .small-button.danger {
      color: var(--red);
    }

    .manual-box {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #d8e7e0;
      border-radius: 8px;
      background: #fbfdfc;
    }

    .manual-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      font-weight: 900;
      color: var(--green-dark);
    }

    .manual-fields {
      display: grid;
      grid-template-columns: minmax(0, 220px) 1fr;
      gap: 10px;
      align-items: start;
    }

    .manual-call {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border-radius: 8px;
      background: #245f9f;
      color: #fff;
      padding: 0 12px;
      text-decoration: none;
      font-weight: 900;
    }

    .manual-call.hidden {
      display: none;
    }

    .save-state {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    details {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    summary {
      color: var(--blue);
      cursor: pointer;
      font-weight: 800;
    }

    .source-grid {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 6px 12px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .source-grid a {
      color: var(--blue);
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 28px;
      border: 1px dashed #b9c7c0;
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      text-align: center;
    }

    .load-more {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--green-dark);
      font-weight: 900;
      cursor: pointer;
    }

    .bottom-tools {
      position: sticky;
      bottom: 0;
      z-index: 18;
      display: none;
      gap: 8px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(246, 248, 246, .96);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .bottom-tools button {
      flex: 1;
    }

    @media (max-width: 820px) {
      .bar-inner {
        grid-template-columns: 1fr;
      }

      .progress-pill {
        justify-self: stretch;
        grid-template-columns: auto 1fr;
        justify-content: start;
        text-align: left;
      }

      .controls {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .merge-row {
        grid-template-columns: 1fr;
        gap: 3px;
      }

      .company {
        grid-template-columns: 1fr;
      }

      .serial {
        width: auto;
        height: 34px;
        justify-self: start;
        padding: 0 12px;
      }

      .company-head {
        display: grid;
      }

      .card-actions {
        grid-template-columns: 1fr 1fr;
      }

      .phone-link {
        grid-column: 1 / -1;
      }

      .manual-fields {
        grid-template-columns: 1fr;
      }

      .source-grid {
        grid-template-columns: 80px 1fr;
      }

      .bottom-tools {
        display: flex;
      }

      main {
        padding-bottom: 118px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap bar-inner">
      <div class="brand">
        <h1>GDP 藥商電訪查詢</h1>
        <p>依縣市篩選公司，一點電話即可撥號，電訪進度會保存在這台裝置。</p>
      </div>
      <div class="progress-pill" aria-live="polite">
        <strong id="progressCount">0 / 0</strong>
        <span id="progressLabel">已電訪</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="查詢條件">
      <label>
        縣市
        <select id="citySelect"></select>
      </label>
      <label>
        搜尋
        <input id="searchInput" type="search" placeholder="公司、地址、電話、作業項目">
      </label>
      <label class="toggle-row">
        <input id="phoneOnly" type="checkbox">
        只看有電話
      </label>
      <label class="toggle-row">
        <input id="hideDone" type="checkbox">
        隱藏已電訪
      </label>
      <button class="action-button" id="nextButton" type="button">下一筆未電訪</button>
    </section>

    <section class="tag-filter" aria-label="標籤篩選">
      <div class="filter-mode">
        <button class="mode-button want" type="button" data-filter-mode="want">想要</button>
        <button class="mode-button avoid" type="button" data-filter-mode="avoid">不想要</button>
        <button class="mode-button" type="button" data-clear-tags>清除標籤</button>
      </div>
      <div class="tag-options" id="tagOptions"></div>
      <div class="filter-help" id="filterHelp">先選想要或不想要，再點標籤。</div>
    </section>

    <nav class="city-strip" id="cityStrip" aria-label="縣市快速選擇"></nav>

    <div class="summary-line" id="summaryLine"></div>
    <section class="list" id="companyList" aria-live="polite"></section>
  </main>

  <div class="bottom-tools">
    <button class="action-button" id="mobileNextButton" type="button">下一筆</button>
    <button class="small-button danger" id="resetButton" type="button">清除進度</button>
  </div>

  <script src="./gdp-data.js"></script>
  <script>
    const data = window.GDP_COMPANY_DATA;
    const companies = data.companies;
    const citySelect = document.querySelector("#citySelect");
    const cityStrip = document.querySelector("#cityStrip");
    const searchInput = document.querySelector("#searchInput");
    const phoneOnly = document.querySelector("#phoneOnly");
    const hideDone = document.querySelector("#hideDone");
    const tagOptions = document.querySelector("#tagOptions");
    const filterHelp = document.querySelector("#filterHelp");
    const list = document.querySelector("#companyList");
    const summaryLine = document.querySelector("#summaryLine");
    const progressCount = document.querySelector("#progressCount");
    const nextButton = document.querySelector("#nextButton");
    const mobileNextButton = document.querySelector("#mobileNextButton");
    const resetButton = document.querySelector("#resetButton");
    const storageKey = "gdp-call-progress-v1";
    const stateKey = "gdp-call-state-v1";
    const manualKey = "gdp-manual-data-v1";

    let progress = loadProgress();
    let manualData = loadManualData();
    let state = loadState();
    let visibleCompanies = [];
    let renderLimit = 60;
    const tagChoices = ["製造業", "販賣業", "西藥製劑", "原料藥", "冷鏈藥品", "醫用氣體", "採購", "儲存", "供應", "運輸", "輸入", "輸出", "有公開電話", "無公開電話", "有手動電話", "有備註"];
    let activeTagMode = state.activeTagMode || "want";
    let includeTags = new Set(state.includeTags || []);
    let excludeTags = new Set(state.excludeTags || []);

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || {};
      } catch {
        return {};
      }
    }

    function saveProgress() {
      localStorage.setItem(storageKey, JSON.stringify(progress));
    }

    function loadManualData() {
      try {
        return JSON.parse(localStorage.getItem(manualKey)) || {};
      } catch {
        return {};
      }
    }

    function saveManualData() {
      localStorage.setItem(manualKey, JSON.stringify(manualData));
    }

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(stateKey)) || {};
      } catch {
        return {};
      }
    }

    function saveState() {
      localStorage.setItem(stateKey, JSON.stringify(state));
    }

    function defaultCity() {
      if (state.city) return state.city;
      return data.stats.cities.some((city) => city.name === "台中市") ? "台中市" : data.stats.cities[0].name;
    }

    function initCities() {
      const options = data.stats.cities.map((city) => `<option value="${escapeHtml(city.name)}">${escapeHtml(city.name)} (${city.count})</option>`);
      citySelect.innerHTML = options.join("");
      citySelect.value = defaultCity();
      cityStrip.innerHTML = data.stats.cities.map((city) => {
        return `<button type="button" class="city-chip" data-city="${escapeHtml(city.name)}">${escapeHtml(city.name)} ${city.count}</button>`;
      }).join("");
      setActiveCityChip();
    }

    function setActiveCityChip() {
      let active = null;
      document.querySelectorAll(".city-chip").forEach((button) => {
        const isActive = button.dataset.city === citySelect.value;
        button.classList.toggle("active", isActive);
        if (isActive) active = button;
      });
      if (active) active.scrollIntoView({ block: "nearest", inline: "center" });
    }

    function splitKindTags(kind) {
      return String(kind || "").split(" / ").map((item) => item.trim()).filter(Boolean);
    }

    function companyTagSet(company) {
      const manual = manualData[company.id] || {};
      return new Set([
        ...(company.kindTags || splitKindTags(company.kind)),
        ...(company.tags || []),
        ...(company.actions || []),
        company.phone ? "有公開電話" : "無公開電話",
        manual.phone ? "有手動電話" : "",
        manual.note ? "有備註" : "",
      ].filter(Boolean));
    }

    function hasAnyPhone(company) {
      const manual = manualData[company.id] || {};
      return Boolean(company.phone || manual.phone);
    }

    function renderTagFilters() {
      document.querySelectorAll("[data-filter-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.filterMode === activeTagMode);
      });
      tagOptions.innerHTML = tagChoices.map((tag) => {
        const want = includeTags.has(tag);
        const avoid = excludeTags.has(tag);
        const className = want ? " want" : avoid ? " avoid" : "";
        const prefix = want ? "想要 " : avoid ? "不要 " : "";
        return `<button class="filter-chip${className}" type="button" data-filter-tag="${escapeHtml(tag)}">${prefix}${escapeHtml(tag)}</button>`;
      }).join("");
      const wanted = [...includeTags].map((tag) => `想要 ${tag}`).join("、") || "沒有想要標籤";
      const avoided = [...excludeTags].map((tag) => `不要 ${tag}`).join("、") || "沒有排除標籤";
      filterHelp.textContent = `${wanted}；${avoided}`;
    }

    function toggleFilterTag(tag) {
      if (activeTagMode === "want") {
        excludeTags.delete(tag);
        includeTags.has(tag) ? includeTags.delete(tag) : includeTags.add(tag);
      } else {
        includeTags.delete(tag);
        excludeTags.has(tag) ? excludeTags.delete(tag) : excludeTags.add(tag);
      }
      applyFilters();
    }

    function clearTagFilters() {
      includeTags = new Set();
      excludeTags = new Set();
      applyFilters();
    }

    function normalize(value) {
      return String(value || "").toLocaleLowerCase("zh-Hant").replace(/\s+/g, "");
    }

    function companySearchText(company) {
      return normalize([
        company.name,
        company.address,
        company.phone,
        company.kind,
        (company.kindTags || []).join(" "),
        company.westOps,
        company.apiOps,
        company.intro,
        company.tags.join(" "),
        (company.actions || []).join(" "),
        (manualData[company.id]?.phone || ""),
        (manualData[company.id]?.note || ""),
        (company.recordDetails || []).map((item) => `${item.id} ${item.kind} ${item.westOps} ${item.apiOps}`).join(" "),
      ].join(" "));
    }

    function applyFilters() {
      const city = citySelect.value;
      const keyword = normalize(searchInput.value);
      visibleCompanies = companies.filter((company) => {
        if (company.city !== city) return false;
        if (phoneOnly.checked && !hasAnyPhone(company)) return false;
        if (hideDone.checked && progress[company.id]) return false;
        const tags = companyTagSet(company);
        for (const tag of includeTags) {
          if (!tags.has(tag)) return false;
        }
        for (const tag of excludeTags) {
          if (tags.has(tag)) return false;
        }
        if (keyword && !companySearchText(company).includes(keyword)) return false;
        return true;
      });
      state.city = city;
      state.search = searchInput.value;
      state.phoneOnly = phoneOnly.checked;
      state.hideDone = hideDone.checked;
      state.includeTags = [...includeTags];
      state.excludeTags = [...excludeTags];
      state.activeTagMode = activeTagMode;
      saveState();
      setActiveCityChip();
      renderTagFilters();
      renderLimit = 60;
      render();
    }

    function render() {
      const cityAll = companies.filter((company) => company.city === citySelect.value);
      const cityCalled = cityAll.filter((company) => progress[company.id]).length;
      const publicPhoneCount = visibleCompanies.filter((company) => company.phone).length;
      const manualPhoneCount = visibleCompanies.filter((company) => manualData[company.id]?.phone).length;
      const sourceRows = visibleCompanies.reduce((sum, company) => sum + (company.sourceCount || 1), 0);
      progressCount.textContent = `${cityCalled} / ${cityAll.length}`;
      summaryLine.innerHTML = [
        `<strong>${escapeHtml(citySelect.value)}</strong>`,
        `符合 ${visibleCompanies.length} 家`,
        `原始 ${sourceRows} 筆`,
        `已載入 ${Math.min(renderLimit, visibleCompanies.length)} 家`,
        `公開電話 ${publicPhoneCount} 家`,
        `手動電話 ${manualPhoneCount} 家`,
        `已電訪 ${cityCalled} 家`,
      ].map((item) => `<span>${item}</span>`).join("");

      if (!visibleCompanies.length) {
        list.innerHTML = `<div class="empty">沒有符合條件的公司。</div>`;
        return;
      }

      const rendered = visibleCompanies.slice(0, renderLimit);
      const more = visibleCompanies.length > renderLimit
        ? `<button class="load-more" type="button" data-load-more>載入更多 ${Math.min(60, visibleCompanies.length - renderLimit)} 筆</button>`
        : "";
      list.innerHTML = rendered.map((company, index) => companyCard(company, index + 1)).join("") + more;
    }

    function companyCard(company, filteredIndex) {
      const done = Boolean(progress[company.id]);
      const manual = manualData[company.id] || {};
      const phoneLabel = company.phone ? escapeHtml(company.phone) : "無公開電話";
      const phoneHref = company.phone ? `tel:${telNumber(company.phone)}` : "#";
      const manualPhone = manual.phone || "";
      const manualNote = manual.note || "";
      const manualHref = manualPhone ? `tel:${telNumber(manualPhone)}` : "#";
      const sourceTag = company.confidence ? `<span class="tag source">${escapeHtml(company.confidence)}信心</span>` : `<span class="tag warn">待查電話</span>`;
      const ops = [company.westOps && `西藥製劑：${company.westOps}`, company.apiOps && `原料藥：${company.apiOps}`].filter(Boolean).join("；");
      const recordIds = Array.isArray(company.recordIds) ? company.recordIds.join(", ") : company.id;
      const mergedTag = company.sourceCount > 1 ? `<span class="tag source">合併 ${company.sourceCount} 筆</span>` : "";
      const kindTags = company.kindTags || splitKindTags(company.kind);
      const mergeRows = company.sourceCount > 1 ? mergeDetails(company) : "";
      return `
        <article class="company${done ? " done" : ""}" id="company-${company.id}">
          <div class="serial">${filteredIndex}</div>
          <div class="company-main">
            <div class="company-head">
              <div>
                <h2>${escapeHtml(company.name)}</h2>
                <div class="meta">
                  <span class="tag">原始序號 ${escapeHtml(recordIds)}</span>
                  ${mergedTag}
                  ${kindTags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
                  <span class="tag">${escapeHtml(company.district || company.city)}</span>
                  ${company.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
                  ${sourceTag}
                </div>
              </div>
            </div>
            ${mergeRows}
            <p class="intro">${escapeHtml(company.intro)}</p>
            <p class="address">${escapeHtml(company.address)}</p>
            ${ops ? `<p class="ops">${escapeHtml(ops)}</p>` : ""}
            <div class="card-actions">
              <a class="phone-link${company.phone ? "" : " missing"}" href="${phoneHref}" data-call="${company.id}">${phoneLabel}</a>
              <button class="small-button${done ? " done" : ""}" type="button" data-done="${company.id}">
                ${done ? "已電訪" : "標記已電訪"}
              </button>
              <button class="small-button" type="button" data-copy="${escapeHtml(company.phone || "")}" ${company.phone ? "" : "disabled"}>複製電話</button>
            </div>
            <div class="manual-box" data-manual-box="${escapeHtml(company.id)}">
              <div class="manual-title">
                <span>手動資料</span>
                <a class="manual-call${manualPhone ? "" : " hidden"}" href="${manualHref}" data-manual-call="${escapeHtml(company.id)}">撥打手動電話：${escapeHtml(manualPhone)}</a>
              </div>
              <div class="manual-fields">
                <label>
                  手動電話
                  <input type="tel" inputmode="tel" placeholder="例如 04-12345678" value="${escapeHtml(manualPhone)}" data-manual-phone="${escapeHtml(company.id)}">
                </label>
                <label>
                  備註
                  <textarea placeholder="窗口、分機、回電時間、是否有意願..." data-manual-note="${escapeHtml(company.id)}">${escapeHtml(manualNote)}</textarea>
                </label>
              </div>
              <div class="save-state" data-save-state="${escapeHtml(company.id)}">${manualPhone || manualNote ? "已儲存在這台裝置" : "尚未填寫手動資料"}</div>
            </div>
            <details>
              <summary>來源與比對</summary>
              <div class="source-grid">
                <span>狀態</span><strong>${escapeHtml(company.lookupStatus)}</strong>
                <span>原始序號</span><strong>${escapeHtml(recordIds)}</strong>
                <span>來源</span><strong>${escapeHtml(company.phoneSource || "無")}</strong>
                <span>網址</span>${company.sourceUrl ? `<a href="${escapeHtml(company.sourceUrl)}" target="_blank" rel="noreferrer">${escapeHtml(company.sourceUrl)}</a>` : "<strong>無</strong>"}
                <span>說明</span><strong>${escapeHtml(company.matchNote || "未找到可驗證公開電話")}</strong>
              </div>
            </details>
          </div>
        </article>
      `;
    }

    function mergeDetails(company) {
      const rows = (company.recordDetails || []).map((item) => {
        const west = item.westOps ? `西藥製劑：${escapeHtml(item.westOps)}` : "西藥製劑：無";
        const api = item.apiOps ? `原料藥：${escapeHtml(item.apiOps)}` : "原料藥：無";
        return `
          <div class="merge-row">
            <span class="merge-id">#${escapeHtml(item.id)}</span>
            <span class="merge-kind">${escapeHtml(item.kind)}</span>
            <span>${west}</span>
            <span>${api}</span>
          </div>
        `;
      }).join("");
      return `<div class="merge-records"><strong>合併明細</strong>${rows}</div>`;
    }

    function telNumber(phone) {
      return String(phone || "").replace(/#/g, ",").replace(/[^\d,+]/g, "");
    }

    function toggleDone(id) {
      const key = String(id);
      if (progress[key]) {
        delete progress[key];
      } else {
        progress[key] = new Date().toISOString();
      }
      saveProgress();
      applyFilters();
    }

    function markDone(id, shouldRender = true) {
      const key = String(id);
      progress[key] = new Date().toISOString();
      saveProgress();
      if (shouldRender) applyFilters();
    }

    function updateManualField(id, field, value) {
      const key = String(id);
      const current = manualData[key] || {};
      current[field] = value.trim();
      current.updatedAt = new Date().toISOString();
      if (!current.phone && !current.note) {
        delete manualData[key];
      } else {
        manualData[key] = current;
      }
      saveManualData();
      refreshManualDisplay(key);
    }

    function refreshManualDisplay(id) {
      const manual = manualData[id] || {};
      const call = document.querySelector(`[data-manual-call="${cssEscape(id)}"]`);
      const stateLabel = document.querySelector(`[data-save-state="${cssEscape(id)}"]`);
      if (call) {
        if (manual.phone) {
          call.classList.remove("hidden");
          call.href = `tel:${telNumber(manual.phone)}`;
          call.textContent = `撥打手動電話：${manual.phone}`;
        } else {
          call.classList.add("hidden");
          call.href = "#";
          call.textContent = "撥打手動電話";
        }
      }
      if (stateLabel) {
        stateLabel.textContent = manual.phone || manual.note ? "已儲存在這台裝置" : "尚未填寫手動資料";
      }
      renderTagFilters();
    }

    function goNext() {
      const target = visibleCompanies.find((company) => !progress[company.id] && hasAnyPhone(company)) ||
        visibleCompanies.find((company) => !progress[company.id]);
      if (!target) return;
      const targetIndex = visibleCompanies.findIndex((company) => company.id === target.id);
      if (targetIndex >= renderLimit) {
        renderLimit = targetIndex + 1;
        render();
      }
      window.setTimeout(() => {
        document.querySelector(`#company-${target.id}`)?.scrollIntoView({ block: "center", behavior: "smooth" });
      }, 60);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(String(value));
      return String(value).replace(/"/g, '\\"');
    }

    function wireEvents() {
      citySelect.addEventListener("change", applyFilters);
      searchInput.addEventListener("input", applyFilters);
      phoneOnly.addEventListener("change", applyFilters);
      hideDone.addEventListener("change", applyFilters);
      nextButton.addEventListener("click", goNext);
      mobileNextButton.addEventListener("click", goNext);
      resetButton.addEventListener("click", () => {
        if (!confirm("要清除這台裝置上的電訪進度嗎？")) return;
        progress = {};
        saveProgress();
        applyFilters();
      });
      cityStrip.addEventListener("click", (event) => {
        const button = event.target.closest("[data-city]");
        if (!button) return;
        citySelect.value = button.dataset.city;
        applyFilters();
      });
      document.querySelectorAll("[data-filter-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          activeTagMode = button.dataset.filterMode;
          renderTagFilters();
        });
      });
      document.querySelector("[data-clear-tags]").addEventListener("click", clearTagFilters);
      tagOptions.addEventListener("click", (event) => {
        const button = event.target.closest("[data-filter-tag]");
        if (!button) return;
        toggleFilterTag(button.dataset.filterTag);
      });
      list.addEventListener("click", async (event) => {
        const doneButton = event.target.closest("[data-done]");
        if (doneButton) {
          toggleDone(doneButton.dataset.done);
          return;
        }
        const loadMoreButton = event.target.closest("[data-load-more]");
        if (loadMoreButton) {
          renderLimit += 60;
          render();
          return;
        }
        const copyButton = event.target.closest("[data-copy]");
        if (copyButton) {
          const phone = copyButton.dataset.copy;
          if (phone && navigator.clipboard) {
            await navigator.clipboard.writeText(phone);
            copyButton.textContent = "已複製";
            setTimeout(() => { copyButton.textContent = "複製電話"; }, 1200);
          }
          return;
        }
        const callLink = event.target.closest("[data-call]");
        if (callLink) {
          markDone(callLink.dataset.call, false);
          window.setTimeout(applyFilters, 800);
        }
      });
      list.addEventListener("input", (event) => {
        const phoneInput = event.target.closest("[data-manual-phone]");
        if (phoneInput) {
          updateManualField(phoneInput.dataset.manualPhone, "phone", phoneInput.value);
          return;
        }
        const noteInput = event.target.closest("[data-manual-note]");
        if (noteInput) {
          updateManualField(noteInput.dataset.manualNote, "note", noteInput.value);
        }
      });
    }

    function init() {
      initCities();
      searchInput.value = state.search || "";
      phoneOnly.checked = Boolean(state.phoneOnly);
      hideDone.checked = Boolean(state.hideDone);
      wireEvents();
      renderTagFilters();
      applyFilters();
    }

    init();
  </script>
</body>
</html>
